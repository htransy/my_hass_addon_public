name: Ecovacs China Backend
version: 1.2.7
slug: ecovacs_cn_backend
description: Secure Ecovacs China cloud, MQTT, map, sensor and command backend
url: https://github.com/example/ecovacs-cn-backend
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
ingress: true
ingress_port: 4545
panel_icon: mdi:robot-vacuum
panel_title: Ecovacs Backend
webui: http://[HOST]:[PORT:4545]
watchdog: http://[HOST]:[PORT:4545]/health
services:
  - mqtt:want
ports:
  4545/tcp: null
ports_description:
  4545/tcp: API nội bộ; chỉ ánh xạ ra host khi thật sự cần
options:
  log_level: info
  map_refresh_interval: 30
  state_refresh_interval: 120
  mqtt_enabled: true
  mqtt_map_enabled: true
  mqtt_map_min_interval: 5
  mqtt_map_max_bytes: 2000000
schema:
  log_level: list(debug|info|warning|error)
  map_refresh_interval: int(5,60)
  state_refresh_interval: int(15,300)
  mqtt_enabled: bool
  mqtt_map_enabled: bool
  mqtt_map_min_interval: int(1,60)
  mqtt_map_max_bytes: int(64000,10000000)
apparmor: true
host_network: false
privileged: []
image: "ghcr.io/trankhanhduy2929-beep/ecovacs_cn_backend-{arch}"
